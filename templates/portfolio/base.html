{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mossa Ndayambaje | Software Engineer{% endblock %}</title>

    <!-- Site Icon / Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'portfolio/images/logo.svg' %}">
    <link rel="shortcut icon" href="{% static 'portfolio/images/logo.svg' %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Lenis Smooth Scroll CSS -->
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">

    <style>
        :root {
            --font-display: "Anton", sans-serif;
            --font-sans: "Onest", sans-serif;
            --background: #08080a;
            --foreground: #f3f1ea;
            --surface: #111114;
            --surface-2: #17171b;
            --muted: #9ca3af;
            --line: rgba(243, 241, 234, 0.1);
            --line-strong: rgba(243, 241, 234, 0.22);
            --accent: #ff3b1d;
            --gutter: 2.5rem;
            --section: 8rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 16px; background: var(--background); }
        html.lenis, html.lenis body { height: auto; }

        @media (max-width:640px){
            :root { --gutter: 1.25rem; --section: 4rem; }
        }

        body {
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        ::selection { background: var(--accent); color: var(--background); }
        a { text-decoration: none; color: inherit; }

        /* Preloader Overlay */
        #preloader {
            position: fixed; inset: 0; z-index: 200;
            background: var(--background);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: var(--gutter);
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
        }

        /* Center Spinning Image Logo */
        .preloader-center-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .preloader-svg-logo {
            width: 5.5rem;
            height: 5.5rem;
            object-fit: contain;
            animation: spinLogo 12s linear infinite;
        }

        @keyframes spinLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .preloader-brand {
            font-family: var(--font-display);
            font-size: 1.75rem;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -0.01em;
            color: var(--foreground);
        }

        .preloader-counter {
            font-family: var(--font-display);
            font-size: 7.5rem;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--foreground);
            align-self: flex-end;
        }
        .preloader-counter span { color: var(--accent); }

        /* Solid Fixed Header */
        header {
            position: fixed;
            inset-inline: 0;
            top: 0;
            z-index: 100;
            background-color: #08080a;
            border-bottom: 1px solid var(--line);
        }
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem var(--gutter);
        }

        .logo-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.3rem;
            height: 2.3rem;
            border-radius: 9999px;
            border: 1px solid var(--line-strong);
            overflow: hidden;
            padding: 0.2rem;
            background: var(--surface);
        }
        .logo-badge img { width: 100%; height: 100%; object-fit: contain; }

        .logo-name {
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 0.10em;
            color: var(--foreground);
            margin-left: 0.75rem;
        }

        .nav-links { display: flex; gap: 2rem; list-style: none; }
        @media (max-width: 767px) { .nav-links { display: none; } }

        .nav-link {
            position: relative;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
            transition: color 0.2s ease;
        }
        .nav-link:hover { color: var(--foreground); }

        .eyebrow { display: flex; align-items: center; gap: 0.75rem; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); }
        .eyebrow-dot { width: 0.4rem; height: 0.4rem; border-radius: 9999px; background: var(--accent); }

        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .in-view .reveal-up, .in-view.reveal-up {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Preloader Overlay -->
    <div id="preloader">
        <div class="preloader-brand">Mossa Ndayambaje</div>
        <div class="preloader-center-logo">
            <img src="{% static 'portfolio/images/logo.svg' %}" class="preloader-svg-logo" alt="Loading Logo">
        </div>
        <div class="preloader-counter"><span id="preloader-num">0</span><span>%</span></div>
    </div>

    <!-- Navigation Header -->
    <header>
        <nav>
            <a href="#top" style="display: flex; align-items: center;">
                <div class="logo-badge">
                    <img src="{% static 'portfolio/images/logo.svg' %}" alt="MN Logo">
                </div>
                <span class="logo-name">MossCodes</span>
            </a>
            <ul class="nav-links">
                <li><a class="nav-link" href="#story">Story</a></li>
                <li><a class="nav-link" href="#languages">Stack</a></li>
                <li><a class="nav-link" href="#ventures">Projects</a></li>
                <li><a class="nav-link" href="#impact">Impact</a></li>
                <li><a class="nav-link" href="#voices">Gallery</a></li>
                <li><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main style="position: relative; width: 100%; overflow-x: hidden;">
        {% block content %}{% endblock %}
    </main>

    <!-- Lenis Smooth Scroll Script -->
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true,
            touchMultiplier: 1.5,
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Preloader Counter & Smooth Dismissal
        const preloader = document.getElementById("preloader");
        const numEl = document.getElementById("preloader-num");
        let count = 0;

        const interval = setInterval(() => {
            count += 2;
            if (count > 100) count = 100;
            if (numEl) numEl.textContent = count;

            if (count === 100) {
                clearInterval(interval);
                setTimeout(dismissPreloader, 200);
            }
        }, 20);

        function dismissPreloader() {
            if (preloader) {
                preloader.style.transform = "translateY(-100%)";
                document.body.classList.add("hero-active");
            }
        }

        // Safety fallback
        setTimeout(dismissPreloader, 3000);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("in-view");
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('section, .reveal-up').forEach(el => observer.observe(el));
    </script>
</body>
</html>
